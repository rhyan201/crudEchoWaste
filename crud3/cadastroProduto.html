<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="crud.css" />
    <title>EcoWaste - Produtos</title>
  </head>
  <body>
    <div class="container-produto">
      <h1>Cadastro de Produtos</h1>

      <form id="cadprod">
        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" /><br />

        <label for="quantidade">Quantidade(kg):</label>
        <input type="number" id="quantidade" /><br />

        <label for="preconormal">Preço normal:</label>
        <input type="number" step="0.01" id="preconormal" /><br />

        <label for="precopromo">Preço promocional:</label>
        <input type="number" step="0.01" id="precopromo" /><br />

        <label for="horario">Horário para retirada:</label>
        <input type="datetime-local" id="horario" /><br />
      </form>

      <div id="alterar"></div>

      <button id="bt_enviar">Enviar</button> <!-- fica fora do form porque um botão dentro do form envia e recarrega a página -->
      <button id="return" type="button" onclick="window.location.href='../index.html'">Voltar</button> <!-- volta para o menu principal do projeto -->

      <ul id="p_produtos"></ul>
      <!-- lista de itens cadastrados -->
    </div>
    <script src="script.js"></script>
  </body>
</html>
