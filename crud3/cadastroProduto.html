<!DOCTYPE html>
<html lang="pt-br">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
    <head>
        <meta charset="UTF-8">
        <title>EcoWaste - Produtos</title>
    </head>
    <body>
        <h1>Cadastro de Produtos</h1>

        <form id="cadprod">
            <label for="nome">Nome do produto:</label>
            <input type="text" id="nome"><br>

            <label for="quantidade">Quantidade(kg):</label>
            <input type="number" id="quantidade"><br>

            <label for="preconormal">Preço normal:</label>
            <input type="number" step="0.01" id="preconormal"><br>

            <label for="precopromo">Preço promocional:</label>
            <input type="number" step="0.01" id="precopromo"><br>

            <label for="horario">Horário para retirada:</label>
            <input type="datetime-local" id="horario"><br>

        </form>

        <div id="alterar"></div>
        
        <button id="bt_enviar">Enviar</button>
        <button id="return">Voltar</button>

        <ul id="p_produtos"></ul> <!-- lista de itens cadastrados -->

        <script src="script.js"></script>
    </body>
</html>
